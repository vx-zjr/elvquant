[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elvquant-core"
version = "0.1.0"
description = "Document-driven, test-first quantitative trading core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = [
    "kagglehub>=1.0",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["qts"]
strict = true
warn_unused_configs = true
