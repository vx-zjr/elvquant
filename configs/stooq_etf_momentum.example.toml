# Commit-safe Stooq ETF momentum research example.
# Stooq v1 does not require secrets. Do not put API keys in this file.

provider = "stooq"
asset_ids = ["SPY.US", "QQQ.US", "IWM.US", "TLT.US", "GLD.US"]
start = "2015-01-01"
end = "2025-12-31"
strategy = "momentum_vs_equal_weight"
seed = "stooq-etf-momentum-v1"

[parameters]
data_path = "data/processed/stooq_etf_eod.csv"
reports_dir = "reports"
train_start = "2015-01-01"
train_end = "2022-01-01"
validation_start = "2022-01-01"
validation_end = "2024-01-01"
test_start = "2024-01-01"
test_end = "2025-12-31"
lookback_observations = 20
top_n = 1
initial_cash = 10000.0
fixed_commission = 1.0
proportional_commission_rate = 0.0005
slippage_rate = 0.001
